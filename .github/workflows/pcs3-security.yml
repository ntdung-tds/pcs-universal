name: PCS3 Security and Regression
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Audit secrets and action pins
        run: node tools/pcs-security-audit.mjs --root=.
      - name: Test PCS security and core
        run: node --test tests/*.test.mjs
